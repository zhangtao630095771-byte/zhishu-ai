# ═══════════════════════════════════════════════════════════
# 知数AI · 内网 Docker 编排（app + nginx）
#
# 用法：
#   1. cp prod.env.example .env.prod  并填好真实值
#   2. 若上 HTTPS：证书放 deploy/certs/，取消 nginx.conf 里 443 段注释
#   3. docker compose up -d --build
#
# ★ app 不直接映射端口到宿主机，只经 nginx 暴露（80/443），
#   避免 8000 直接裸奔。
# ═══════════════════════════════════════════════════════════
services:
  app:
    build: .
    image: zhishu-ai:latest
    container_name: zhishu-ai
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - zhishu-data:/app/data          # ★ 知识库/账号持久化，必挂
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: zhishu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"                    # 上 HTTPS 时取消注释
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./deploy/certs:/etc/nginx/certs:ro   # 证书目录
    depends_on:
      - app

volumes:
  zhishu-data:
