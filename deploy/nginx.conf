# ═══════════════════════════════════════════════════════════
# 知数AI · nginx 反向代理配置
# ★ 关键点：
#   ① proxy_read_timeout 300s —— 复杂取数要 40~120 秒，默认 60s 会 504
#   ② proxy_buffering off —— 导出大文件别被缓冲卡住
#   ③ 探活打 app 的 /api/ping（公开接口）
# ═══════════════════════════════════════════════════════════

upstream zhishu_app {
    server app:8000;
}

# ── HTTP（内网默认；上 HTTPS 后用下面 443 段，80 保留做跳转）──
server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    location / {
        proxy_pass http://zhishu_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;
    }
}

