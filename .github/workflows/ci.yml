name: CI

# 触发时机：推到 main、PR 到 main、手动触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 单元测试是纯逻辑层，无需 .env / ClickHouse / API Key。
      # 若本地新加了测试文件，记得同步登记到 run_tests.py 的 REGISTRY。
      - name: 运行 unit 层单元测试
        run: python run_tests.py unit

      - name: 校验发版配置文件
        run: |
          test -f VERSION && echo "VERSION: $(cat VERSION)"
          test -f CHANGELOG.md && echo "CHANGELOG.md 存在"
